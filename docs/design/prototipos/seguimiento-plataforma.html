<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Seguimiento de cuentas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Instrument+Serif&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  /* Tokens de DESIGN.md: chrome oscuro, contenido en .surface-light, un solo verde. */
  :root {
    --chrome: #101010;
    --chrome-fg: #f2f2f2;
    --chrome-muted: #bdbdbd;
    --chrome-border: #3d3a39;

    --background: #f4f4f5;
    --card: #ffffff;
    --foreground: #18181b;
    --muted-foreground: #52525b;
    --secondary: #ececef;
    --border: #e4e4e7;
    --brand: #047857;
    --primary: #00d992;
    --primary-pressed: #10b981;
    --primary-foreground: #101010;
    --danger: #e8455a;
    --warning: #e0a63a;

    --tag-neutral-bg: #f2f2f2; --tag-neutral-fg: #3c3c43; --tag-neutral-dot: #8e8e93;
    --tag-info-bg: #e8f1ff;    --tag-info-fg: #0b63ce;    --tag-info-dot: #0a7aff;
    --tag-success-bg: #eaf6ee; --tag-success-fg: #1e7f3e; --tag-success-dot: #34b85f;
    --tag-warning-bg: #fff3ea; --tag-warning-fg: #a8520a; --tag-warning-dot: #ff9f4a;
    --tag-danger-bg: #fdedec;  --tag-danger-fg: #bf3128;  --tag-danger-dot: #eb5a4e;

    --shadow-surface: 0 1px 2px rgb(0 0 0 / .06), 0 8px 24px -12px rgb(0 0 0 / .12);
    --shadow-lift: 0 1px 2px rgb(0 0 0 / .08), 0 16px 32px -12px rgb(0 0 0 / .22);
    --serif: 'Instrument Serif', Georgia, serif;
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font: 400 14px/1.45 var(--sans); background: var(--background); color: var(--foreground); }
  button { font: inherit; color: inherit; cursor: pointer; }
  h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  /* Chrome oscuro */
  .chrome { background: var(--chrome); color: var(--chrome-fg); border-bottom: 1px solid var(--chrome-border); }
  .chrome header { height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 16px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .wordmark { font-size: 18px; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
  .wordmark::before { content: ''; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 14px solid var(--primary); }
  .pill-outline { border: 1px solid var(--chrome-border); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--chrome-muted); }
  .chrome h1 { font: 400 24px/1 var(--serif); letter-spacing: -.01em; border-left: 1px solid var(--chrome-border); padding-left: 12px; white-space: nowrap; }
  .back { background: none; border: 0; color: var(--chrome-muted); padding: 6px 10px; border-radius: 8px; }
  nav.sections { display: flex; gap: 4px; overflow-x: auto; padding: 0 16px 8px; }
  nav.sections a { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 16px; border-radius: 999px; color: var(--chrome-muted); text-decoration: none; white-space: nowrap; }
  nav.sections a.active { background: rgb(242 242 242 / .1); color: var(--chrome-fg); }

  main { max-width: 1180px; margin: 0 auto; padding: 16px 16px 64px; }

  .proto-note { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 16px; font-size: 12px; color: var(--muted-foreground); }

  /* Tabs */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .tabs { display: inline-flex; gap: 2px; padding: 4px; background: var(--card); border-radius: 14px; box-shadow: var(--shadow-surface); }
  .tab { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: none; color: var(--muted-foreground); }
  .tab[aria-selected='true'] { background: var(--secondary); color: var(--foreground); }
  .tab:focus-visible, .btn:focus-visible, .chip:focus-visible, .row:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .period { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted-foreground); }

  /* Cards y KPIs */
  .card { background: var(--card); border-radius: 28px; box-shadow: var(--shadow-surface); padding: 20px 24px; }
  .card h2 { font-size: 15px; font-weight: 500; }
  .card .sub { font-size: 12px; color: var(--muted-foreground); margin-top: 2px; }
  .grid { display: grid; gap: 12px; }
  .kpis { grid-template-columns: repeat(2, 1fr); margin-bottom: 12px; }
  .kpi { background: var(--card); border-radius: 28px; box-shadow: var(--shadow-surface); padding: 16px 20px; }
  .kpi dt { font-size: 12px; color: var(--muted-foreground); }
  .kpi dd { font-size: 28px; line-height: 1.2; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .kpi small { display: block; font-size: 12px; color: var(--muted-foreground); margin-top: 2px; }
  .kpi.hero { background: var(--chrome); color: var(--chrome-fg); }
  .kpi.hero dt, .kpi.hero small { color: var(--chrome-muted); }
  .kpi.hero dd { color: var(--primary); }
  .two { grid-template-columns: 1fr; }
  @media (min-width: 720px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 960px) { .two { grid-template-columns: 1.4fr 1fr; } .two.even { grid-template-columns: 1fr 1fr; } }

  .kpi.muted { background: transparent; box-shadow: none; border: 1px dashed #d4d4d8; }
  .kpi.muted dd { color: var(--muted-foreground); }
  .plan-bar { display: flex; gap: 3px; height: 28px; margin-top: 16px; }
  .plan-bar .seg { border-radius: 6px; }
  .plan-bar .seg.prueba { background: #0a7aff; }
  .plan-bar .seg.activa { background: #34b85f; }
  .plan-bar .seg.ilimitado { background: #8e8e93; }
  .plan-bar .seg.vencida { background: #eb5a4e; }
  .plan-legend { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 12px; }
  .plan-legend li { display: flex; align-items: center; gap: 8px; }
  .plan-legend .num { font: 13px var(--mono); }
  .group-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; color: var(--muted-foreground); margin-top: 4px; }
  .callout { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border-radius: 22px; box-shadow: var(--shadow-surface); padding: 14px 20px; margin-bottom: 12px; }
  .callout strong { font-weight: 500; }
  .callout .num { font-family: var(--mono); font-size: 13px; }

  /* Tags */
  .tag { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px 2px 4px; font-size: 12px; line-height: 20px; white-space: nowrap; }
  .tag::before { content: ''; width: 12px; height: 12px; border-radius: 50%; margin-left: 2px; }
  .tag.neutral { background: var(--tag-neutral-bg); color: var(--tag-neutral-fg); } .tag.neutral::before { background: var(--tag-neutral-dot); }
  .tag.info { background: var(--tag-info-bg); color: var(--tag-info-fg); } .tag.info::before { background: var(--tag-info-dot); }
  .tag.success { background: var(--tag-success-bg); color: var(--tag-success-fg); } .tag.success::before { background: var(--tag-success-dot); }
  .tag.warning { background: var(--tag-warning-bg); color: var(--tag-warning-fg); } .tag.warning::before { background: var(--tag-warning-dot); }
  .tag.danger { background: var(--tag-danger-bg); color: var(--tag-danger-fg); } .tag.danger::before { background: var(--tag-danger-dot); }

  /* Altas por semana */
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted-foreground); margin: 12px 0 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .weeks { display: flex; align-items: flex-end; gap: 6px; height: 160px; }
  .weeks li { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
  .weeks .stack { width: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
  .weeks .seg-t { background: var(--primary); border-radius: 3px 3px 0 0; }
  .weeks .seg-i { background: #52525b; }
  .weeks .total { font-size: 11px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted-foreground); margin-top: 8px; }

  /* Barras horizontales (roles) */
  .hbars { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .hbar .head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .hbar .head span:last-child { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 12px; }
  .track { height: 8px; background: var(--secondary); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; background: #52525b; border-radius: 999px; }
  .fill.brand { background: var(--primary); }

  /* Embudo */
  .funnel { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .step { display: grid; grid-template-columns: 28px 1fr auto; gap: 4px 12px; align-items: center; }
  .step .n { width: 28px; height: 28px; border-radius: 8px; background: var(--secondary); font: 12px var(--mono); display: grid; place-items: center; }
  .step .label { font-size: 13px; }
  .step .val { font: 13px var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  .step .bar { grid-column: 2 / 3; height: 28px; background: var(--secondary); border-radius: 8px; overflow: hidden; }
  .step .bar > div { height: 100%; background: var(--primary); border-radius: 8px; }
  .step .conv { grid-column: 3; text-align: right; }
  .stuck { margin-top: 16px; padding: 12px 16px; border-radius: 14px; background: var(--background); font-size: 13px; }

  table.cohort { width: 100%; border-collapse: separate; border-spacing: 3px; margin-top: 16px; font-size: 12px; }
  table.cohort th { font-weight: 400; color: var(--muted-foreground); text-align: center; padding: 4px; }
  table.cohort th:first-child, table.cohort td:first-child { text-align: left; white-space: nowrap; }
  table.cohort td { text-align: center; padding: 8px 4px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  table.cohort td:first-child { background: none; padding-left: 0; }

  /* Seguimiento */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .search { position: relative; flex: 1 1 240px; max-width: 360px; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted-foreground); }
  .search input { width: 100%; height: 36px; border: 0; border-radius: 8px; background: var(--card); box-shadow: var(--shadow-surface); padding: 0 12px 0 36px; font: inherit; color: inherit; }
  .search input:focus-visible { outline: 2px solid var(--primary); }
  .chip { height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--card); box-shadow: var(--shadow-surface); display: inline-flex; gap: 8px; align-items: center; }
  .chip[aria-pressed='true'] { background: var(--foreground); color: #fff; }
  .chip .c { font: 12px var(--mono); opacity: .7; }

  .section-label { display: flex; align-items: center; gap: 12px; margin: 20px 0 10px; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; color: var(--muted-foreground); }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .rows { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: var(--card); border: 0; width: 100%; text-align: left; border-radius: 22px; box-shadow: var(--shadow-surface); padding: 16px 20px; transition: box-shadow .2s; position: relative; }
  .row:hover { box-shadow: var(--shadow-lift); }
  .row[aria-expanded='true'] { box-shadow: var(--shadow-lift); outline: 2px solid var(--primary); }
  .row .body { flex: 1 1 280px; min-width: 0; }
  .row .l1 { display: flex; align-items: center; gap: 8px; }
  .row .l1 span.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .l2 { font-size: 12px; color: var(--muted-foreground); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .stage { width: 170px; flex: none; }
  .row .stage .mini { display: flex; gap: 3px; margin-top: 6px; }
  .row .stage .mini i { flex: 1; height: 4px; border-radius: 999px; background: var(--secondary); }
  .row .stage .mini i.on { background: var(--primary); }
  .row .stage .txt { font-size: 12px; color: var(--muted-foreground); }
  .row .end { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .row .plan-col { width: 96px; display: flex; justify-content: flex-end; }
  .row .status { width: 168px; display: flex; justify-content: flex-end; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--card); box-shadow: var(--shadow-surface); }
  .btn.primary { background: var(--primary); color: var(--primary-foreground); box-shadow: inset 0 -1px 0 var(--primary-pressed), 0 1px 2px rgb(0 0 0 / .15); }
  .btn.primary:hover { background: var(--primary-pressed); }
  .btn.ghost { background: none; box-shadow: none; padding: 0 8px; }
  .btn.ghost:hover { background: var(--secondary); }

  .detail { background: var(--card); border-radius: 22px; box-shadow: var(--shadow-lift); padding: 20px 24px; margin-top: -4px; display: none; }
  .detail.open { display: block; }
  .stepper { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 4px 0 20px; }
  .stepper li { font-size: 12px; color: var(--muted-foreground); }
  .stepper .bar { height: 4px; border-radius: 999px; background: var(--secondary); margin-bottom: 8px; }
  .stepper li.done .bar { background: var(--primary); }
  .stepper li.done { color: var(--foreground); }
  .stepper li.next .bar { background: repeating-linear-gradient(90deg, var(--primary) 0 6px, var(--secondary) 6px 10px); }
  .stepper li.next { color: var(--foreground); }
  .facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 720px) { .facts { grid-template-columns: repeat(4, 1fr); } }
  .fact dt { font-size: 12px; color: var(--muted-foreground); }
  .fact dd { font-size: 20px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .fact dd small { font-size: 12px; color: var(--muted-foreground); display: block; margin-top: 2px; }
  .privacy { display: flex; gap: 8px; align-items: flex-start; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); }
  .detail .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

  .directory-note { text-align: center; padding: 56px 24px; color: var(--muted-foreground); }

  @media (max-width: 719px) {
    .row .stage, .row .status, .row .plan-col { width: auto; }
    .row .end { margin-left: 0; width: 100%; justify-content: space-between; }
    .chrome h1 { font-size: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="chrome">
  <header>
    <div class="brand">
      <span class="wordmark">Luma</span>
      <span class="pill-outline">Plataforma</span>
      <h1>Usuarios</h1>
    </div>
    <button class="back" type="button">← Volver a la app</button>
  </header>
  <nav class="sections" aria-label="Secciones de la plataforma">
    <a class="active" href="#" aria-current="page"><svg class="i" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Usuarios</a>
    <a href="#"><svg class="i" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Actividad</a>
    <a href="#"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>Campañas</a>
    <a href="#"><svg class="i" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Feedback</a>
    <a href="#"><svg class="i" viewBox="0 0 24 24"><path d="M3 21h18M5 21V10m14 11V10M9 21V10m6 11V10M2 10l10-7 10 7"/></svg>Pagos</a>
    <a href="#"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M12 8V4M8 14h.01M16 14h.01"/></svg>Asistente</a>
  </nav>
</div>

<main>
  <p class="proto-note">
    <span class="tag warning">Prototipo</span>
    Datos de ejemplo, no reales. Muestra cómo quedaría la pantalla con lo que ya se puede calcular de la base.
  </p>

  <div class="toolbar">
    <div class="tabs" role="tablist" aria-label="Vistas de usuarios">
      <button class="tab" role="tab" id="tab-census" aria-selected="true" data-tab="census"><svg class="i" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16V9m5 7V5m5 11v-4"/></svg>Censo</button>
      <button class="tab" role="tab" id="tab-funnel" aria-selected="false" data-tab="funnel"><svg class="i" viewBox="0 0 24 24"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"/></svg>Embudo</button>
      <button class="tab" role="tab" id="tab-follow" aria-selected="false" data-tab="follow"><svg class="i" viewBox="0 0 24 24"><path d="M13 5h8M13 12h8M13 19h8M3 17l2 2 4-4M3 7l2 2 4-4"/></svg>Seguimiento</button>
      <button class="tab" role="tab" id="tab-dir" aria-selected="false" data-tab="dir"><svg class="i" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Directorio</button>
    </div>
    <div class="period">Datos al <span id="today"></span></div>
  </div>

  <section id="panel" role="tabpanel" aria-live="polite"></section>
</main>

<script>
  /* ───── Datos de ejemplo ───── */
  const TODAY = new Date('2026-11-05T12:00:00');
  const DAY = 86400000;
  const fmt = (d, o) => new Intl.DateTimeFormat('es-ES', o).format(d);
  document.getElementById('today').textContent = fmt(TODAY, { day: 'numeric', month: 'long', year: 'numeric' });

  /* Una persona cuenta una sola vez, con esta precedencia:
     cuenta de prueba (@luma.test, fuera de todo) > con membresía > empleado > cliente. */
  const CENSUS = {
    holders: 48, inactive: 7, testAccounts: 23,
    /* Estado de la membresía de las 48 cuentas que tienen una. */
    plans: [
      ['prueba', 'En prueba', 27, 'info'],
      ['activa', 'Pagando', 14, 'success'],
      ['ilimitado', 'Plan ilimitado', 2, 'neutral'],
      ['vencida', 'Vencida', 5, 'danger'],
    ],
    clients: 54,
    staffRoles: [['Supervisor', 31], ['Contador', 18], ['Arquitecto', 12], ['Ingeniero', 9], ['Diseñador', 7]],
    signupsHolders: [2, 3, 1, 4, 3, 5, 4, 6, 3, 5, 7, 5],
    signupsGuests:  [4, 6, 5, 9, 8, 11, 10, 14, 12, 15, 19, 18],
  };
  CENSUS.staff = CENSUS.staffRoles.reduce((a, r) => a + r[1], 0);
  CENSUS.guests = CENSUS.clients + CENSUS.staff;
  CENSUS.total = CENSUS.holders + CENSUS.guests + CENSUS.inactive;

  const STAGES = ['Registrado', 'Correo confirmado', 'Primera obra', 'Primer invitado', 'Primera actividad o presupuesto', 'Primer gasto o cobro'];
  const FUNNEL = [48, 41, 33, 24, 19, 11];
  const ACTIVE_7D = 15;

  const COHORTS = [
    ['2026-09-28', 4, [100, 100, 100, 75, 75, 50]],
    ['2026-10-05', 6, [100, 83, 83, 67, 50, 33]],
    ['2026-10-12', 3, [100, 100, 100, 67, 33, 33]],
    ['2026-10-19', 5, [100, 80, 80, 60, 40, 20]],
    ['2026-10-26', 7, [100, 86, 71, 43, 14, 0]],
    ['2026-11-02', 5, [100, 80, 40, 20, 0, 0]],
  ];

  /* joined = días desde el alta · last = días desde la última acción (null = ninguna) · stage = etapa alcanzada (0-5) */
  const HOLDERS = [
    { name: 'Marcela Ibarra',  email: 'marcela@ejemplo.com',  joined: 1,  stage: 1, obras: 0, act: 0,  last: null, inv: {} },
    { name: 'Ana Soria',       email: 'ana.soria@ejemplo.com', joined: 2,  stage: 0, obras: 0, act: 0,  last: null, inv: {} },
    { name: 'Tomás Quiroga',   email: 'tomas.q@ejemplo.com',   joined: 5,  stage: 0, obras: 0, act: 0,  last: null, inv: {} },
    { name: 'Lucía Bermúdez',  email: 'lucia.b@ejemplo.com',   joined: 6,  stage: 1, obras: 0, act: 0,  last: null, inv: {} },
    { name: 'Daniela Fuentes', email: 'dani.fuentes@ejemplo.com', joined: 4, stage: 2, obras: 1, act: 0, last: 1,  inv: {} },
    { name: 'Rodrigo Vera',    email: 'rodrigo.v@ejemplo.com', joined: 10, stage: 2, obras: 1, act: 0,  last: 8,  inv: {} },
    { name: 'Javier Luna',     email: 'javier.luna@ejemplo.com', joined: 11, stage: 3, obras: 1, act: 0, last: 3,  inv: { Cliente: 1 } },
    { name: 'Esteban Molina',  email: 'esteban.m@ejemplo.com', joined: 14, stage: 4, obras: 1, act: 12, last: 1,  inv: { Cliente: 1, Supervisor: 1 } },
    { name: 'Camila Duarte',   email: 'camila.d@ejemplo.com',  joined: 18, stage: 5, obras: 2, act: 41, last: 0,  inv: { Cliente: 2, Supervisor: 1, Contador: 1 } },
    { name: 'Hernán Castro',   email: 'hernan.c@ejemplo.com',  joined: 20, stage: 2, obras: 1, act: 0,  last: 13, inv: {} },
    { name: 'Valentina Rojas', email: 'vale.rojas@ejemplo.com', joined: 24, stage: 4, obras: 1, act: 9, last: 2,  inv: { Cliente: 1, Supervisor: 1 } },
    { name: 'Paula Navarro',   email: 'paula.n@ejemplo.com',   joined: 27, stage: 5, obras: 3, act: 63, last: 1,  inv: { Cliente: 3, Supervisor: 1, Arquitecto: 1 } },
    { name: 'Gustavo Salas',   email: 'gustavo.s@ejemplo.com', joined: 33, stage: 3, obras: 1, act: 0,  last: 19, inv: { Cliente: 1 } },
  ];

  const TRIAL_DAYS = 30;

  /* Estado de la membresía de cada cuenta. Se deriva de `subscriptionState` (shared); acá es dato de ejemplo. */
  const PLAN_OF = { 'Camila Duarte': 'activa', 'Paula Navarro': 'activa', 'Gustavo Salas': 'vencida' };
  HOLDERS.forEach((h) => { h.plan = PLAN_OF[h.name] ?? 'prueba'; });
  const PLAN_TAG = { prueba: ['info', 'En prueba'], activa: ['success', 'Pagando'], vencida: ['danger', 'Vencida'], ilimitado: ['neutral', 'Ilimitado'] };
  const trialLeft = (h) => (h.plan === 'prueba' ? TRIAL_DAYS - h.joined : null);

  /* Reglas de ejemplo para el semáforo; la versión real vive en shared, pura y con tests. */
  function health(h) {
    const left = trialLeft(h);
    if (h.plan === 'vencida') return { key: 'expired', tone: 'danger', label: 'Solo lectura', risk: true };
    if (h.stage <= 1 && h.joined >= 3) return { key: 'blocked', tone: 'danger', label: h.stage === 0 ? 'No confirmó el correo' : 'Sin primera obra', risk: true };
    if (h.last !== null && h.last >= 7) return { key: 'cold', tone: 'warning', label: 'Se enfrió', risk: true };
    if (left !== null && left <= 7 && h.stage < 5) return { key: 'trial', tone: 'warning', label: 'Prueba por vencer', risk: true };
    if (h.joined < 3) return { key: 'new', tone: 'neutral', label: 'Recién llegó', risk: false };
    return { key: 'ok', tone: 'success', label: 'En marcha', risk: false };
  }

  /* ───── Utilidades ───── */
  const ICON = {
    search: '<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
    mail: '<svg class="i" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>',
    shield: '<svg class="i" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
    info: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
    more: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>',
  };
  const ago = (d) => (d === null ? 'sin actividad' : d === 0 ? 'hoy' : d === 1 ? 'ayer' : `hace ${d} días`);
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const weekLabel = (iso) => fmt(new Date(iso + 'T12:00:00'), { day: 'numeric', month: 'short' });
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const panel = document.getElementById('panel');

  /* ───── Censo ───── */
  function renderCensus() {
    const c = CENSUS;
    const weeks = [];
    const monday = new Date(TODAY); monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
    for (let i = 11; i >= 0; i--) weeks.push(new Date(monday.getTime() - i * 7 * DAY));
    const peak = Math.max(...c.signupsHolders.map((n, i) => n + c.signupsGuests[i]));
    const staffMax = Math.max(c.clients, ...c.staffRoles.map((r) => r[1]));
    const bar = (name, n, cls = '') => `
      <div class="hbar"><div class="head"><span>${name}</span><span>${n}</span></div>
      <div class="track"><div class="fill ${cls}" style="width:${(n / staffMax) * 100}%"></div></div></div>`;

    return `
      <div class="callout">${ICON.info}
        <p>Hoy la pantalla de usuarios cuenta <strong class="num">${c.total}</strong> cuentas. <strong>Solo ${c.holders} tienen una membresía</strong>. Las otras son ${c.clients} clientes que entran a ver el estado de su obra, ${c.staff} empleados de una obra ajena y ${c.inactive} bajas. Además hay ${c.testAccounts} cuentas de prueba que ya no entran en ninguna cifra.</p>
      </div>
      <dl class="grid kpis">
        <div class="kpi hero"><dt>Con membresía</dt><dd>${c.holders}</dd><small>las cuentas que importan</small></div>
        <div class="kpi"><dt>Clientes</dt><dd>${c.clients}</dd><small>solo miran el estado de su obra</small></div>
        <div class="kpi"><dt>Empleados</dt><dd>${c.staff}</dd><small>supervisores, contadores y profesionales</small></div>
        <div class="kpi muted"><dt>Cuentas de prueba</dt><dd>${c.testAccounts}</dd><small>@luma.test · no cuentan</small></div>
      </dl>

      <div class="card" style="margin-bottom:12px">
        <h2>Estado de la membresía</h2>
        <p class="sub">De las ${c.holders} cuentas que tienen una. ${c.plans.find((p) => p[0] === 'vencida')[2]} están en solo lectura.</p>
        <div class="plan-bar" role="img" aria-label="Estado de la membresía">
          ${c.plans.map(([k, , n]) => `<div class="seg ${k}" style="flex:${n}"></div>`).join('')}
        </div>
        <ul class="plan-legend">
          ${c.plans.map(([k, label, n, tone]) => `<li><span class="tag ${tone}">${label}</span><span class="num">${n}</span><span class="sub">${pct(n, c.holders)}%</span></li>`).join('')}
        </ul>
      </div>

      <div class="grid two">
        <div class="card">
          <h2>Altas por semana</h2>
          <p class="sub">Últimas 12 semanas · ${c.holders} con membresía y ${c.guests} sin ella</p>
          <div class="legend"><span><i style="background:var(--primary)"></i>Con membresía</span><span><i style="background:#52525b"></i>Clientes y empleados</span></div>
          <ol class="weeks" aria-label="Altas por semana">
            ${weeks.map((w, i) => {
              const t = c.signupsHolders[i], g = c.signupsGuests[i], tot = t + g;
              const h = (n) => `${(n / peak) * 100}%`;
              return `<li title="Semana del ${fmt(w, { day: 'numeric', month: 'short' })}: ${t} con membresía, ${g} sin ella">
                <span class="total">${tot}</span>
                <div class="stack" style="height:${h(tot)}"><div class="seg-t" style="height:${(t / tot) * 100}%"></div><div class="seg-i" style="height:${(g / tot) * 100}%"></div></div>
              </li>`;
            }).join('')}
          </ol>
          <div class="axis"><span>${fmt(weeks[0], { day: 'numeric', month: 'short' })}</span><span>${fmt(weeks[11], { day: 'numeric', month: 'short' })}</span></div>
        </div>
        <div class="card">
          <h2>Quiénes no tienen membresía</h2>
          <p class="sub">${(c.guests / c.holders).toFixed(1).replace('.', ',')} personas invitadas por cada cuenta con membresía</p>
          <div class="hbars">
            <div class="group-label">Clientes</div>
            ${bar('Cliente', c.clients, 'brand')}
            <div class="group-label">Empleados</div>
            ${c.staffRoles.map(([name, n]) => bar(name, n)).join('')}
          </div>
          <p class="sub" style="margin-top:16px">Cada persona cuenta una vez: si tiene membresía propia, gana sobre cualquier rol que tenga en otras obras. Un rol con menos de 5 personas no se muestra.</p>
        </div>
      </div>`;
  }

  /* ───── Embudo ───── */
  function renderFunnel() {
    const drops = FUNNEL.slice(1).map((n, i) => 1 - n / FUNNEL[i]);
    const worst = drops.indexOf(Math.max(...drops)) + 1;
    return `
      <dl class="grid kpis">
        <div class="kpi hero"><dt>Cuentas con membresía</dt><dd>${FUNNEL[0]}</dd><small>las que empezaron una prueba propia</small></div>
        <div class="kpi"><dt>Llegaron a su primera obra</dt><dd>${pct(FUNNEL[2], FUNNEL[0])}%</dd><small>${FUNNEL[2]} de ${FUNNEL[0]}</small></div>
        <div class="kpi"><dt>Llegaron a cargar plata</dt><dd>${pct(FUNNEL[5], FUNNEL[0])}%</dd><small>${FUNNEL[5]} con un gasto o cobro</small></div>
        <div class="kpi"><dt>Activos en 7 días</dt><dd>${ACTIVE_7D}</dd><small>hicieron al menos una acción</small></div>
      </dl>
      <div class="grid two">
        <div class="card">
          <h2>Dónde se caen las cuentas con membresía</h2>
          <p class="sub">Cada barra es cuántos llegaron a esa etapa. La tasa es contra la etapa anterior.</p>
          <ol class="funnel">
            ${STAGES.map((s, i) => `
              <li class="step">
                <span class="n">${i + 1}</span>
                <span class="label">${s}</span>
                <span class="val">${FUNNEL[i]}</span>
                <div class="bar"><div style="width:${(FUNNEL[i] / FUNNEL[0]) * 100}%"></div></div>
                <span class="conv">${i === 0 ? '' : `<span class="tag ${i === worst ? 'danger' : 'neutral'}">${pct(FUNNEL[i], FUNNEL[i - 1])}%${i === worst ? ' · mayor caída' : ''}</span>`}</span>
              </li>`).join('')}
          </ol>
          <p class="stuck"><strong>${FUNNEL[1] - FUNNEL[2]} cuentas</strong> confirmaron el correo y no crearon ninguna obra. Son los que más conviene contactar.</p>
        </div>
        <div class="card">
          <h2>Por semana de alta</h2>
          <p class="sub">Porcentaje de cada cohorte que llegó a cada etapa</p>
          <table class="cohort">
            <thead><tr><th>Semana</th><th>Altas</th>${STAGES.slice(1).map((_, i) => `<th title="${STAGES[i + 1]}">${i + 2}</th>`).join('')}</tr></thead>
            <tbody>
              ${COHORTS.map(([week, size, row]) => `<tr>
                <td>${weekLabel(week)}</td><td>${size}</td>
                ${row.slice(1).map((v) => `<td style="background:rgb(0 217 146 / ${(v / 100) * 0.55})">${v}%</td>`).join('')}
              </tr>`).join('')}
            </tbody>
          </table>
          <p class="sub" style="margin-top:12px">Las columnas 2 a 6 son las etapas del embudo. Las cohortes recientes todavía no tuvieron tiempo de avanzar.</p>
        </div>
      </div>`;
  }

  /* ───── Seguimiento ───── */
  const FILTERS = [
    ['all', 'Todos'], ['risk', 'Necesitan atención'], ['prueba', 'En prueba'], ['activa', 'Pagando'], ['vencida', 'Vencida'],
  ];
  const state = { filter: 'all', q: '', open: null };

  function matches(h) {
    const hl = health(h);
    if (state.q && !(h.name + ' ' + h.email).toLowerCase().includes(state.q.toLowerCase())) return false;
    if (state.filter === 'all') return true;
    if (state.filter === 'risk') return hl.risk;
    return h.plan === state.filter;
  }

  function row(h, i) {
    const hl = health(h);
    const left = trialLeft(h);
    const guests = Object.values(h.inv).reduce((a, b) => a + b, 0);
    const trial = h.plan === 'prueba' ? `prueba: ${left} d` : h.plan === 'vencida' ? `vencida hace ${h.joined - TRIAL_DAYS} d` : 'membresía al día';
    const meta = [h.email, `alta ${ago(h.joined)}`, trial].join(' · ');
    const metrics = [`${h.obras} ${h.obras === 1 ? 'obra' : 'obras'}`, `${guests} ${guests === 1 ? 'invitado' : 'invitados'}`, `${h.act} actividades`, `última acción: ${ago(h.last)}`].join(' · ');
    const open = state.open === i;
    return `
      <li>
        <button class="row" data-row="${i}" aria-expanded="${open}">
          <div class="body">
            <div class="l1"><span class="name">${esc(h.name)}</span></div>
            <div class="l2">${esc(meta)}</div>
            <div class="l2">${esc(metrics)}</div>
          </div>
          <div class="stage">
            <div class="txt">${STAGES[h.stage]}</div>
            <div class="mini" aria-hidden="true">${STAGES.map((_, k) => `<i class="${k <= h.stage ? 'on' : ''}"></i>`).join('')}</div>
          </div>
          <div class="end">
            <span class="plan-col"><span class="tag ${PLAN_TAG[h.plan][0]}">${PLAN_TAG[h.plan][1]}</span></span>
            <span class="status"><span class="tag ${hl.tone}">${hl.label}</span></span>
            <span class="btn ${hl.risk ? 'primary' : ''}" data-act="msg" data-i="${i}">${ICON.mail}${hl.risk ? 'Escribirle' : 'Ver'}</span>
            <span class="btn ghost" aria-label="Más acciones">${ICON.more}</span>
          </div>
        </button>
        <div class="detail ${open ? 'open' : ''}" id="detail-${i}">${open ? detail(h) : ''}</div>
      </li>`;
  }

  function detail(h) {
    const hl = health(h);
    const guests = Object.entries(h.inv);
    return `
      <ol class="stepper" aria-label="Etapas">
        ${STAGES.map((s, k) => `<li class="${k <= h.stage ? 'done' : k === h.stage + 1 ? 'next' : ''}"><div class="bar"></div>${s}</li>`).join('')}
      </ol>
      <dl class="facts">
        <div class="fact"><dt>Obras</dt><dd>${h.obras}</dd></div>
        <div class="fact"><dt>Invitados</dt><dd>${guests.reduce((a, [, n]) => a + n, 0)}<small>${guests.length ? guests.map(([r, n]) => `${n} ${r.toLowerCase()}`).join(' · ') : 'ninguno todavía'}</small></dd></div>
        <div class="fact"><dt>Actividades creadas</dt><dd>${h.act}</dd></div>
        <div class="fact"><dt>Última acción</dt><dd>${ago(h.last)}</dd></div>
      </dl>
      <div class="actions">
        <span class="btn primary">${ICON.mail}Escribirle desde Campañas</span>
        <span class="btn">Copiar correo</span>
      </div>
      <p class="privacy">${ICON.shield}<span>Solo cantidades. Esta vista no muestra nombres de clientes, descripciones ni montos de ${esc(h.name.split(' ')[0])}. Membresía: <strong>${PLAN_TAG[h.plan][1].toLowerCase()}</strong>. Estado calculado: <strong>${hl.label}</strong>.</span></p>`;
  }

  function renderFollow() {
    const list = HOLDERS.filter(matches);
    const attention = list.filter((h) => health(h).risk);
    const rest = list.filter((h) => !health(h).risk);
    const idx = (h) => HOLDERS.indexOf(h);
    const count = (key) => HOLDERS.filter((h) => { return key === 'all' ? true : key === 'risk' ? health(h).risk : h.plan === key; }).length;
    const group = (label, items) => items.length ? `<div class="section-label">${label} · ${items.length}</div><ul class="rows">${items.map((h) => row(h, idx(h))).join('')}</ul>` : '';

    return `
      <div class="filters">
        <label class="search">${ICON.search}<input id="q" type="search" placeholder="Buscar por nombre o correo" value="${esc(state.q)}" aria-label="Buscar cuenta" /></label>
        ${FILTERS.map(([k, label]) => `<button class="chip" data-filter="${k}" aria-pressed="${state.filter === k}">${label}<span class="c">${count(k)}</span></button>`).join('')}
      </div>
      ${list.length ? group('Necesitan atención', attention) + group('En marcha', rest) : '<p class="directory-note">Ninguna cuenta coincide con ese filtro.</p>'}
      <p class="sub" style="margin-top:16px;font-size:12px;color:var(--muted-foreground)">Solo cuentas con membresía. Muestra de ${HOLDERS.length} de ${CENSUS.holders}. Ordenados por alta, la más reciente primero.</p>`;
  }

  /* ───── Directorio (lo que existe hoy) ───── */
  function renderDirectory() {
    return `<div class="card directory-note"><p>Acá queda el listado actual de cuentas con búsqueda, filtros por estado y plan ilimitado.<br/>Se le suma un filtro por segmento: con membresía, cliente, empleado y cuenta de prueba.</p></div>`;
  }

  /* ───── Enrutado de pestañas ───── */
  const VIEWS = { census: renderCensus, funnel: renderFunnel, follow: renderFollow, dir: renderDirectory };
  let current = 'census';
  function render() {
    panel.setAttribute('aria-labelledby', 'tab-' + (current === 'census' ? 'census' : current));
    panel.innerHTML = VIEWS[current]();
    const q = document.getElementById('q');
    if (q) {
      q.addEventListener('input', (e) => { state.q = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); });
    }
  }
  document.querySelector('.tabs').addEventListener('click', (e) => {
    const tab = e.target.closest('.tab'); if (!tab) return;
    current = tab.dataset.tab;
    document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t === tab)));
    render();
  });
  panel.addEventListener('click', (e) => {
    const chip = e.target.closest('[data-filter]');
    if (chip) { state.filter = chip.dataset.filter; render(); return; }
    const r = e.target.closest('[data-row]');
    if (r) { const i = Number(r.dataset.row); state.open = state.open === i ? null : i; render(); }
  });
  render();
</script>
</body>
</html>
